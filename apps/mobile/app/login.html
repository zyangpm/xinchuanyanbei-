<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新传研背 - 登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="statusbar">
      <span>9:41</span>
      <span>●●●</span>
    </div>
    
    <div class="login-body">
      <div class="login-logo">
        <div class="logo-icon">新</div>
        <div class="app-name">新传研背</div>
        <div class="app-slogan">新传考研背诵学习工具</div>
      </div>
      
      <div class="login-tabs">
        <div class="login-tab active" onclick="switchLoginTab('password')">手机号登录</div>
        <div class="login-tab" onclick="guestLogin()">游客体验</div>
      </div>
      
      <div id="password-login" class="login-form">
        <div class="form-group">
          <input type="text" class="login-input" id="phone-input" placeholder="请输入手机号（新账号自动注册）">
        </div>
        <div class="form-group">
          <input type="password" class="login-input" id="password-input" placeholder="请输入密码（至少6位）">
        </div>
        <div class="login-options">
          <div class="remember-me">
            <input type="checkbox" id="remember" checked>
            <label for="remember">记住密码</label>
          </div>
          <div class="forget-password" onclick="showConfirm('找回密码', '请联系客服找回密码', 'info')">忘记密码？</div>
        </div>
        <button class="login-btn" onclick="handleLogin()">登录</button>
        <div style="margin-top:10px;font-size:12px;color:var(--ink-light);text-align:center;">未注册的手机号验证后将自动创建账号，收藏/笔记/掌握度自动云同步</div>
      </div>
      
      <div class="login-agreement">
        <input type="checkbox" id="agreement" checked>
        <label for="agreement">我已阅读并同意<span class="link">《用户协议》</span>和<span class="link">《隐私政策》</span></label>
      </div>
    </div>
  </div>
  
  <script src="xc-sync.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
