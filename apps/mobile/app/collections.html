<!DOCTYPE html>

    <div class="statusbar">
      <span>9:41</span>

      <div class="search-box" style="display:flex;align-items:center;background:var(--paper);border-radius:18px;padding:8px 14px;gap:8px;flex:1;margin-right:12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索收藏内容..." style="border:none;background:transparent;flex:1;font-size:13px;outline:none;color:var(--ink);" oninput="filterCollectionsBySearch(this.value)">
      </div>
    </div>
    
    <div class="app-body">
      <div class="filter-row">
        <div class="filter-chip active" onclick="filterCollection('all', event)">全部</div>
        <div class="filter-chip" onclick="filterCollection('noun', event)">名词解释</div>
        <div class="filter-chip" onclick="filterCollection('short', event)">简答题</div>
        <div class="filter-chip" onclick="filterCollection('essay', event)">论述题</div>
      </div>
      
      <div data-collection-group="noun">
        <div class="lib-group">名词解释</div>
        <div class="lib-row" data-type="noun" onclick="navigateTo('noun-detail.html?term=沉默的螺旋')">
          <span>沉默的螺旋</span><span class="tag">高频</span>
        </div>
        <div class="lib-row" data-type="noun" onclick="navigateTo('noun-detail.html?term=编码解码模型')">
          <span>编码解码模型</span><span class="tag">高频</span>
        </div>
        <div class="lib-row" data-type="noun" onclick="navigateTo('noun-detail.html?term=议程设置')">

        </div>
      </div>
      
      <div data-collection-group="short">
        <div class="lib-group" style="margin-top:10px;">简答题</div>

      <div data-collection-group="essay">

        <div class="lib-row" data-type="essay" onclick="navigateTo('essay-detail.html?essay=essay001')">

        </div>
        <div class="lib-row" data-type="essay" onclick="navigateTo('essay-detail.html?essay=essay002')">
