<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新传研背 - 个人中心</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="profile-body" style="padding:10px 0 0;margin-top:30px;">
      <div class="profile-hero" style="flex-direction:column;align-items:center;padding:20px 16px 16px;">
        <div class="profile-avatar" onclick="openAvatarColorModal()" style="width:64px;height:64px;font-size:26px;margin-bottom:8px;">林</div>
        <div class="profile-name" id="profile-user-name" onclick="openEditModal('nickname')" style="font-size:18px;font-weight:700;margin-bottom:4px;">林同学</div>
        <div class="profile-stats" id="profile-user-days" style="font-size:12px;color:var(--ink-light);">2027届新传考研・已坚持42天</div>
      </div>
      
      <div style="display:flex;justify-content:space-around;padding:0 20px 20px;margin-bottom:12px;">
        <div style="text-align:center;">
          <div style="font-size:22px;font-weight:700;color:var(--ink);">386</div>
          <div style="font-size:11px;color:var(--ink-light);">已背词条</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:22px;font-weight:700;color:var(--ink);">57</div>
          <div style="font-size:11px;color:var(--ink-light);">我的收藏</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:22px;font-weight:700;color:var(--ink);">12</div>
          <div style="font-size:11px;color:var(--ink-light);">我的笔记</div>
        </div>
      </div>
      
      <div style="background:#fff;margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid rgba(36,58,94,0.06);">
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('settings.html#account')"><span>账号管理</span><span class="val">›</span></div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('settings.html#preference')"><span>学习偏好设置</span><span class="val">›</span></div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('collections.html')"><span>自建资料收藏</span><span class="val">›</span></div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('settings.html#ai')"><span>AI模型自定义管理</span><span class="val">›</span></div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('settings.html#general')"><span>系统通用设置</span><span class="val">›</span></div>
        <div class="settings-row" style="padding:14px 16px;cursor:pointer;" onclick="navigateTo('settings.html#about')"><span>意见反馈 / 关于 App</span><span class="val">›</span></div>
      </div>
      
      <div style="height:20px;"></div>
    </div>
    
    <div class="bottomnav">
      <div class="nav-item" onclick="navigateTo('index.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>首页</span></div>
      <div class="nav-item" onclick="navigateTo('knowledge.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 12h6"/><path d="M15 15h6"/></svg></span><span>知识库</span></div>
      <div class="nav-item" onclick="navigateTo('collections.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span>收藏</span></div>
      <div class="nav-item" onclick="navigateTo('exam-home.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>考试</span></div>
      <div class="nav-item active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>我的</span></div>
    </div>
    
    <div id="edit-modal" class="modal-overlay" style="display:none;" onclick="closeModal('edit-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-title" id="edit-modal-title">修改资料</div>
        <div class="modal-close" onclick="closeModal('edit-modal')">×</div>
        <input type="text" class="form-input" id="edit-input" placeholder="请输入内容">
        <button class="save-btn" onclick="saveEdit()">保存</button>
      </div>
    </div>
    
    <div id="avatar-color-modal" class="modal-overlay" style="display:none;" onclick="closeModal('avatar-color-modal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-title">设置头像</div>
        <div class="modal-close" onclick="closeModal('avatar-color-modal')">×</div>
        <div class="avatar-upload-section">
          <div class="avatar-upload-label">上传自定义头像</div>
          <div class="avatar-upload-btn" onclick="document.getElementById('avatar-file-input').click()">
            <span>📁 从本地图库选择</span>
          </div>
          <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
        </div>
        <div class="avatar-divider">或选择纯色头像</div>
        <div class="avatar-color-list">
          <div class="avatar-color-item" style="background:var(--seal);" onclick="selectAvatarColor('var(--seal)')"></div>
          <div class="avatar-color-item" style="background:var(--red);" onclick="selectAvatarColor('var(--red)')"></div>
          <div class="avatar-color-item" style="background:var(--gold);" onclick="selectAvatarColor('var(--gold)')"></div>
          <div class="avatar-color-item" style="background:var(--green);" onclick="selectAvatarColor('var(--green)')"></div>
          <div class="avatar-color-item" style="background:#8B5CF6;" onclick="selectAvatarColor('#8B5CF6')"></div>
          <div class="avatar-color-item" style="background:#EC4899;" onclick="selectAvatarColor('#EC4899')"></div>
          <div class="avatar-color-item" style="background:#F97316;" onclick="selectAvatarColor('#F97316')"></div>
          <div class="avatar-color-item" style="background:#06B6D4;" onclick="selectAvatarColor('#06B6D4')"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script>
    (function() {
      var info = getUserInfo();
      var nameEl = document.getElementById('profile-user-name');
      var daysEl = document.getElementById('profile-user-days');
      if (nameEl) nameEl.textContent = info.nickname;
      if (daysEl) daysEl.textContent = '2027届新传考研・已坚持' + info.days + '天';
    })();
  </script>
</body>
</html>
