<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新传研背 - 实务题训练</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="statusbar">
      <span>9:41</span>
      <span>●●●</span>
    </div>
    
    <div class="app-body">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="searchbar" id="practice-search" placeholder="搜索实务题 / 题型 / 关键词" oninput="handlePracticeSearch(this.value)">
        <div class="search-result-count" id="practice-result-count"></div>
      </div>
      
      <div class="practice-filter-bar">
        <div class="practice-filter-item active" onclick="filterPracticeType('all')">全部</div>
        <div class="practice-filter-item" onclick="filterPracticeType('消息写作')">消息写作</div>
        <div class="practice-filter-item" onclick="filterPracticeType('新闻评论')">新闻评论</div>
        <div class="practice-filter-item" onclick="filterPracticeType('新闻策划')">新闻策划</div>
        <div class="practice-filter-item" onclick="filterPracticeType('通讯')">通讯</div>
        <div class="practice-filter-item" onclick="filterPracticeType('采访分析')">采访分析</div>
      </div>
      
      <div class="practice-list-wrapper" id="practice-list-container"></div>
    </div>
    
    <div class="bottomnav">
      <div class="nav-item" onclick="navigateTo('index.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>首页</span></div>
      <div class="nav-item" onclick="navigateTo('knowledge.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 12h6"/><path d="M15 15h6"/></svg></span><span>知识库</span></div>
      <div class="nav-item" onclick="navigateTo('collections.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span>收藏</span></div>
      <div class="nav-item active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>考试</span></div>
      <div class="nav-item" onclick="navigateTo('profile.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>我的</span></div>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script src="../../../packages/content/practice-v2-data.js"></script>
  <script>
    var currentFilter = 'all';
    
    function renderPracticeList(practices) {
      var container = document.getElementById('practice-list-container');
      if (!container) return;
      
      if (practices.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无匹配的实务题</div>';
        return;
      }
      
      var html = '';
      practices.forEach(function(item) {
        html += '<div class="practice-card" onclick="navigateTo(\'practice-detail.html?practice=' + item.id + '\')">' +
          '<div class="practice-card-header">' +
          '<span class="practice-card-type">' + item.type + '</span>' +
          '<span class="practice-card-tag">' + item.tag + '</span>' +
          '</div>' +
          '<div class="practice-card-title">' + item.title + '</div>' +
          '<div class="practice-card-meta">' + item.score + '分 · ' + item.wordLimit + '字</div>' +
          '</div>';
      });
      
      container.innerHTML = html;
    }
    
    function filterPracticeType(type) {
      currentFilter = type;
      document.querySelectorAll('.practice-filter-item').forEach(function(el) {
        el.classList.remove('active');
      });
      event.target.classList.add('active');
      updatePracticeList();
    }
    
    function handlePracticeSearch(keyword) {
      updatePracticeList();
    }
    
    function updatePracticeList() {
      var keyword = document.getElementById('practice-search').value.toLowerCase();
      var items = practiceV2Data.items;
      
      var filtered = items.filter(function(item) {
        var matchType = currentFilter === 'all' || item.type === currentFilter;
        var matchKeyword = !keyword || 
          item.title.toLowerCase().indexOf(keyword) !== -1 ||
          item.type.toLowerCase().indexOf(keyword) !== -1 ||
          item.question.toLowerCase().indexOf(keyword) !== -1;
        return matchType && matchKeyword;
      });
      
      var countEl = document.getElementById('practice-result-count');
      if (countEl) {
        countEl.textContent = filtered.length + '道题';
      }
      
      renderPracticeList(filtered);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      updatePracticeList();
    });
  </script>
</body>
</html>
