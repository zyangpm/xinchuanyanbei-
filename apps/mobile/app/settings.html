<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新传研背 - 设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="statusbar">
      <span>9:41</span>
      <span>●●●</span>
    </div>
    
    <div class="app-top">
      <div>
        <button class="crumb-btn" onclick="goBack()"><span>‹ 我的</span></button>
        <div class="app-title">设置</div>
      </div>
    </div>
    
    <div class="app-body" id="settings-main">
      <div style="background:#fff;margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid rgba(36,58,94,0.06);">
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('account')">
          <span>账号管理</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('preference')">
          <span>学习偏好设置</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="openUploadLibrary()">
          <!-- V5.0 L3：自建资料收藏入口激活，打开我的资料库（读 xc_materials，含后台互通资料） -->
          <span>自建资料收藏</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('ai')">
          <span>AI模型自定义管理</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('general')">
          <span>系统通用设置</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;cursor:pointer;" onclick="showSettingsSection('about')">
          <span>意见反馈 / 关于 App</span><span class="val">›</span>
        </div>
      </div>
    </div>
    
    <div class="app-body" id="settings-detail" style="display:none;">
      <div style="background:#fff;margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid rgba(36,58,94,0.06);">
        <div id="detail-content"></div>
      </div>
      <!-- V5.1：底部的"返回设置"冗余入口已移除——页面顶部 crumb（‹ 我的）是唯一返回入口，符合 iOS 风格 -->
    </div>
    
    <div class="bottomnav">
      <div class="nav-item" onclick="navigateTo('index.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>首页</span></div>
      <div class="nav-item" onclick="navigateTo('knowledge.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 12h6"/><path d="M15 15h6"/></svg></span><span>知识库</span></div>
      <div class="nav-item" onclick="navigateTo('collections.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span>收藏</span></div>
      <div class="nav-item" onclick="navigateTo('exam-home.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>考试</span></div>
      <div class="nav-item active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>我的</span></div>
    </div>
  </div>
  
  <script src="xc-sync.js"></script>
  <script src="ai-service.js"></script>
  <script src="app.js"></script>
  <script>
    // V5.0：设置中心激活——各分区行接入真实数据与交互（账号/偏好/AI/系统/反馈）
    var rowStyle = 'padding:14px 16px;border-bottom:1px solid #f0ede6;';
    var rowStyleFlex = 'padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;';
    var rowStyleLast = 'padding:14px 16px;';
    var rowStyleFlexLast = 'padding:14px 16px;display:flex;justify-content:space-between;align-items:center;';

    function showSettingsSection(section) {
      var main = document.getElementById('settings-main');
      var detail = document.getElementById('settings-detail');
      var content = document.getElementById('detail-content');

      var html = '';
      if (section === 'account') {
        var boundEmail = localStorage.getItem('boundEmail');
        var pwdHint = localStorage.getItem('localPasswordHint');
        var phone = localStorage.getItem('userPhone') || '13800000000';
        html = '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openChangePasswordModal()"><span>修改密码</span><span class="val">' + (pwdHint ? '已设置' : '未设置') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '"><span>绑定手机</span><span class="val">' + maskPhone(phone) + '</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openBindEmailModal()"><span>绑定邮箱</span><span class="val">' + (boundEmail ? escapeHtml(boundEmail) : '未绑定') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlexLast + '" onclick="handleLogout()"><span>退出登录</span><span class="val" style="color:var(--red);">›</span></div>';
      } else if (section === 'preference') {
        var dailyGoal = localStorage.getItem('dailyGoal') || '20';
        var reminderOn = localStorage.getItem('reminderEnabled') !== 'false';
        var speed = { slow: '慢速', normal: '标准', fast: '快速' };
        var autoPlayOn = localStorage.getItem('autoPlayVideo') !== 'false';
        html = '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openDailyGoalModal()"><span>每日学习目标</span><span class="val">' + dailyGoal + '个 ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="toggleReminderSetting()"><span>复习提醒</span><span class="val">' + (reminderOn ? '开启' : '关闭') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openStudySpeedModal()"><span>背诵速度</span><span class="val">' + (speed[localStorage.getItem('studySpeed') || 'normal']) + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlexLast + '" onclick="toggleAutoPlaySetting()"><span>自动播放视频</span><span class="val">' + (autoPlayOn ? '开启' : '关闭') + ' ›</span></div>';
      } else if (section === 'ai') {
        var aiName = localStorage.getItem('aiModelName') || 'DeepSeek';
        var hasKey = !!localStorage.getItem('apiKey');
        var hasTpl = !!localStorage.getItem('aiPromptTemplate');
        html = '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openAiModelSetting()"><span>AI模型</span><span class="val">' + escapeHtml(aiName) + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openAiKeySetting()"><span>API Key</span><span class="val">' + (hasKey ? '已配置' : '未配置') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlexLast + '" onclick="openPromptTemplateModal()"><span>自定义提示词模板</span><span class="val">' + (hasTpl ? '已设置' : '未设置') + ' ›</span></div>';
      } else if (section === 'general') {
        var fontSize = localStorage.getItem('fontSize') || 'normal';
        var sizeNames = { small: '小号', normal: '标准', large: '大号', xlarge: '特大' };
        var darkMode = localStorage.getItem('darkMode') || 'false';
        var darkNames = { auto: '跟随系统', 'true': '开启', 'false': '关闭' };
        var notifyOn = localStorage.getItem('notifyPush') !== 'false';
        var offlineOn = localStorage.getItem('offlineSync') !== 'false';
        var syncMode = localStorage.getItem('dataSync') === 'manual' ? '手动' : '自动';
        html = '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openFontSizeModal()"><span>字体大小</span><span class="val">' + sizeNames[fontSize] + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openDarkModeModal()"><span>深色模式</span><span class="val">' + darkNames[darkMode] + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="toggleNotifyPush()"><span>通知推送</span><span class="val">' + (notifyOn ? '开启' : '关闭') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openCacheCleanModal()"><span>缓存清理</span><span class="val">' + (computeCacheBytes() / 1024).toFixed(1) + 'KB ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="toggleOfflineSync()"><span>离线下载</span><span class="val">' + (offlineOn ? 'Wi-Fi下' : '关闭') + ' ›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlexLast + '" onclick="toggleDataSync()"><span>数据同步</span><span class="val">' + syncMode + ' ›</span></div>';
      } else if (section === 'about') {
        var version = localStorage.getItem('APP_VERSION') || 'v5.0.0';
        html = '<div class="settings-row" style="' + rowStyleFlex + '" onclick="openFeedbackModal()"><span>意见反馈</span><span class="val">›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="rateApp()"><span>给个好评</span><span class="val">›</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlex + '" onclick="showAbout()"><span>版本号</span><span class="val">' + version + '</span></div>' +
               '<div class="settings-row" style="' + rowStyleFlexLast + '" onclick="showAbout()"><span>关于新传研背</span><span class="val">›</span></div>';
      }

      content.innerHTML = html;
      main.style.display = 'none';
      detail.style.display = 'block';
    }

    function backToSettingsMain() {
      document.getElementById('settings-main').style.display = 'block';
      document.getElementById('settings-detail').style.display = 'none';
    }

    // V5.1：hash 导航支持——从 profile.html 点"账号管理/学习偏好"等跳过来能自动展开
    // 既要在首次 load 时读 hash，也要在后续 hashchange 时响应（iOS Safari 切 hash 不 reload）
    function applyInitialHash() {
      var hash = window.location.hash.substring(1);
      if (hash && typeof showSettingsSection === 'function' && showSettingsSection(hash) !== false) {
        showSettingsSection(hash);
      }
    }
    window.addEventListener('load', applyInitialHash);
    window.addEventListener('hashchange', applyInitialHash);
  </script>
</body>
</html>
