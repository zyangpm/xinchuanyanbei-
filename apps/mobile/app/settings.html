<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新传研背 - 设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="statusbar">
      <span>9:41</span>
      <span>●●●</span>
    </div>
    
    <div class="app-top">
      <div>
        <button class="crumb-btn" onclick="goBack()"><span>‹ 我的</span></button>
        <div class="app-title">设置</div>
      </div>
    </div>
    
    <div class="app-body" id="settings-main">
      <div style="background:#fff;margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid rgba(36,58,94,0.06);">
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('account')">
          <span>账号管理</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('preference')">
          <span>学习偏好设置</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="navigateTo('collections.html')">
          <span>自建资料收藏</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('ai')">
          <span>AI模型自定义管理</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;cursor:pointer;" onclick="showSettingsSection('general')">
          <span>系统通用设置</span><span class="val">›</span>
        </div>
        <div class="settings-row" style="padding:14px 16px;cursor:pointer;" onclick="showSettingsSection('about')">
          <span>意见反馈 / 关于 App</span><span class="val">›</span>
        </div>
      </div>
    </div>
    
    <div class="app-body" id="settings-detail" style="display:none;">
      <div style="background:#fff;margin:0 16px 12px;border-radius:12px;overflow:hidden;border:1px solid rgba(36,58,94,0.06);">
        <div id="detail-content"></div>
      </div>
      <div style="text-align:center;padding:12px;">
        <button class="crumb-btn" onclick="backToSettingsMain()" style="font-size:13px;color:var(--ink-light);">‹ 返回设置</button>
      </div>
    </div>
    
    <div class="bottomnav">
      <div class="nav-item" onclick="navigateTo('index.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>首页</span></div>
      <div class="nav-item" onclick="navigateTo('knowledge.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 12h6"/><path d="M15 15h6"/></svg></span><span>知识库</span></div>
      <div class="nav-item" onclick="navigateTo('collections.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span>收藏</span></div>
      <div class="nav-item" onclick="navigateTo('exam-home.html')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>考试</span></div>
      <div class="nav-item active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>我的</span></div>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script>
    function showSettingsSection(section) {
      var main = document.getElementById('settings-main');
      var detail = document.getElementById('settings-detail');
      var content = document.getElementById('detail-content');
      
      var html = '';
      if (section === 'account') {
        html = '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;"><span>修改密码</span><span class="val">›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;"><span>绑定手机</span><span class="val">138****8888</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;"><span>绑定邮箱</span><span class="val">未绑定</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;"><span>退出登录</span><span class="val" style="color:var(--red);">›</span></div>';
      } else if (section === 'preference') {
        html = '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>每日学习目标</span><span class="val">20个 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>复习提醒</span><span class="val">每天19:00 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>背诵速度</span><span class="val">标准 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;"><span>自动播放视频</span><span class="val">关闭 ›</span></div>';
      } else if (section === 'ai') {
        html = '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>AI模型</span><span class="val">GPT-4 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>API Key</span><span class="val">已配置 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;"><span>自定义提示词模板</span><span class="val">›</span></div>';
      } else if (section === 'general') {
        html = '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>字体大小</span><span class="val">标准 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>深色模式</span><span class="val">跟随系统 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>通知推送</span><span class="val">开启 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>缓存清理</span><span class="val">23.5MB ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>离线下载</span><span class="val">Wi-Fi下 ›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;"><span>数据同步</span><span class="val">自动 ›</span></div>';
      } else if (section === 'about') {
        html = '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;"><span>意见反馈</span><span class="val">›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;"><span>给个好评</span><span class="val">›</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;border-bottom:1px solid #f0ede6;display:flex;justify-content:space-between;align-items:center;"><span>版本号</span><span class="val">v4.0.0</span></div>' +
               '<div class="settings-row" style="padding:14px 16px;"><span>关于新传研背</span><span class="val">›</span></div>';
      }
      
      content.innerHTML = html;
      main.style.display = 'none';
      detail.style.display = 'block';
    }
    
    function backToSettingsMain() {
      document.getElementById('settings-main').style.display = 'block';
      document.getElementById('settings-detail').style.display = 'none';
    }
    
    window.addEventListener('load', function() {
      var hash = window.location.hash.substring(1);
      if (hash) {
        showSettingsSection(hash);
      }
    });
  </script>
</body>
</html>
