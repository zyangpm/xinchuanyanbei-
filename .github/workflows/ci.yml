name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验全部 JavaScript 语法
        run: |
          find apps scripts -name "*.js" -not -path "*/node_modules/*" -not -path "*/dist/*" -print0 | xargs -0 -n 1 node --check